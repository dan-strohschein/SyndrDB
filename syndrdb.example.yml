# SyndrDB Configuration File Example
# This file documents all available configuration options with their defaults
# Copy this file to syndrdb.yml and customize as needed

# ==============================================================================
# STORAGE CONFIGURATION
# ==============================================================================

# Directory for database files (default: "./data")
data_dir: "./data_files"

# Directory for log files (default: "")
log_dir: "./log_files"

# Directory for temporary files (default: "")
temp_dir: "./temp_files"

# ==============================================================================
# SERVER CONFIGURATION
# ==============================================================================

# Host address to bind to (default: "0.0.0.0")
host: "127.0.0.1"

# Port number to listen on (default: 27017)
port: 1776

# Operation mode: "standalone" or "cluster" (default: "standalone")
mode: "standalone"

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================

# Enable verbose logging (default: false)
verbose: true

# Enable debug mode (default: false)
debug: false

# Enable user debug mode (default: false)
user_debug: false

# Log level: "debug", "info", "warn", "error" (default: "info")
log_level: "info"

# Print logs to screen (default: false)
print_to_screen: true

# ==============================================================================
# AUTHENTICATION & SECURITY
# ==============================================================================

# Enable authentication (default: false)
auth_enabled: false

# Default users to create when authentication is enabled (optional)
# These users are only created if they don't already exist
# WARNING: Change default passwords before production use!
default_users:
  - username: "admin"
    password: "admin123"
  - username: "syndrdb"
    password: "password"

# Session timeout in minutes (default: 30)
session_timeout_minutes: 30

# Maximum concurrent sessions (default: 1000)
max_sessions: 1000

# Maximum connection pool size (default: 100)
max_connections: 100

# Connection idle timeout in minutes (default: 30)
connection_idle_timeout: 30

# ==============================================================================
# INPUT LENGTH LIMITS (MED-003: Memory Exhaustion DoS Prevention)
# ==============================================================================

# Maximum length for individual parameter values in bytes (default: 10000 = 10KB)
# Prevents memory exhaustion attacks via oversized parameter values in parameterized queries
# Example: EXECUTE stmt_name WHERE field = $1 (with large $1 value)
max_parameter_value_length: 10000

# Maximum length for individual field values in bytes (default: 50000 = 50KB)
# Prevents memory exhaustion attacks via oversized JSON/document field values
# Example: ADD DOCUMENT TO BUNDLE "users" WITH {description = "very long string..."}
# Note: Allows reasonable JSON payloads while preventing DoS attacks
max_field_value_length: 50000

# Maximum length for field names in bytes (default: 256)
# Prevents attacks via excessively long field names in document operations
# Example: ADD DOCUMENT TO BUNDLE "users" WITH {"very_long_field_name..." = "value"}
max_field_name_length: 256

# ==============================================================================
# TRANSACTION CONFIGURATION
# ==============================================================================

# Transaction idle timeout (default: "5m")
# Valid time units: "s" (seconds), "m" (minutes), "h" (hours)
# Examples: "30s", "5m", "1h"
# If invalid or <= 0, falls back to 5 minutes with a warning
transaction_idle_timeout: "5m"

# ==============================================================================
# BUNDLE CONFIGURATION
# ==============================================================================

# Bundle storage format: "json" or "binary" (default: "binary")
bundle_storage_format: "binary"

# Bundle buffer size for reads (default: 0)
bundle_buffer_size: 0

# ==============================================================================
# RCU (Read-Copy-Update) CONFIGURATION
# ==============================================================================
# RCU enables lock-free UPDATE and DELETE operations using append-only versioning.
# This dramatically improves concurrency by eliminating lock contention on writes.
# With RCU enabled, writes create new document versions instead of modifying in-place.
# Readers see consistent snapshots without blocking writers.

# Enable RCU-based lock-free updates (default: true)
# When true, UPDATE and DELETE use the append-only path without acquiring bundle locks.
# Disable only if you require strict serializable isolation (rare use case).
enable_rcu_writes: true

# Grace period in milliseconds for superseded document visibility (default: 100)
# After a document is updated, the old version remains visible for this duration
# to allow in-flight reads to complete. Lower values = faster garbage collection,
# higher values = more safety for long-running queries.
rcu_grace_period_ms: 100

# Maximum OCC retry attempts for write-write conflicts (default: 3)
# When two concurrent transactions update the same document, the later one
# retries with a fresh snapshot up to this many times before returning an error.
max_occ_retries: 3

# ==============================================================================
# STORAGE ENGINE CONFIGURATION
# ==============================================================================
storage:
  # Maximum bundle file size in MB before rotation (default: 32)
  # Files will rotate when size exceeds max_size × 1.1 (±10% variance tolerance)
  # This can be adjusted at runtime via: SET SYSTEM bundle_file_max_size_mb = 64;
  bundle_file_max_size_mb: 32

# ==============================================================================
# JOURNAL CONFIGURATION
# ==============================================================================

# Maximum journal file size in bytes (default: 0)
max_journal_file_size: 1000000

# ==============================================================================
# WAL (Write-Ahead Logging) CONFIGURATION
# ==============================================================================

# WAL mode: "sync" or "async" (default: "sync")
wal_mode: "sync"

# Number of async WAL workers (default: 2)
async_wal_workers: 2

# Async WAL queue size (default: 1000)
async_wal_queue_size: 1000

# Enable WAL globally (default: true)
wal_enabled: true

# Operations per second threshold for bulk mode (default: 50)
wal_bulk_mode_threshold: 50

# Disable WAL during bulk operations (default: true)
wal_disable_for_bulk: true

# ==============================================================================
# METADATA CONFIGURATION
# ==============================================================================

# Documents before metadata flush (default: 500)
metadata_batch_size: 500

# Documents before disk persistence (default: 1000)
metadata_persist_interval: 1000

# Time in seconds between forced flushes (default: 0)
metadata_flush_interval: 10

# Auto-detect bulk operations for optimization (default: true)
bulk_operation_detection: true

# ==============================================================================
# INDEX CONFIGURATION
# ==============================================================================

# Safety margin for sequence recovery (default: 100)
index_sequence_safety_margin: 100

# ==============================================================================
# PARSER CONFIGURATION
# ==============================================================================

# Use new SyndrQL parser instead of legacy parser (default: true)
use_new_parser: true

# ==============================================================================
# SORTING OPTIMIZATION CONFIGURATION
# ==============================================================================

# Top-N Heapsort Configuration
# Ratio of LIMIT/total_rows for Top-N activation (default: 0.1)
sort_topn_threshold: 0.1

# Minimum dataset size for Top-N optimization (default: 100)
sort_topn_min_size: 100

# Initial heap capacity for Top-N queries (default: 1000)
sort_heap_initial_capacity: 1000

# Radix Sort Configuration
# Minimum dataset size for radix sort (default: 1000)
sort_radix_min_size: 1000

# Minimum LIMIT/total_rows ratio for radix (default: 0.5)
sort_radix_limit_ratio: 0.5

# Maximum radix sort passes for wide integers (default: 8)
sort_radix_max_passes: 8

# SIMD String Sort Configuration
# Enable SIMD string sorting optimization (default: true)
sort_simd_enabled: true

# Bytes used for abbreviated string keys (default: 8)
sort_simd_abbrev_bytes: 8

# Minimum dataset size for SIMD activation (default: 100)
sort_simd_min_size: 100

# Parallel Sort Configuration
# Enable parallel sorting for large datasets (default: true)
sort_parallel_enabled: false

# Minimum dataset size for parallel sort (default: 10000)
sort_parallel_min_size: 10000

# Maximum memory in MB for sorting operations (default: 512)
sort_max_memory_mb: 512

# ==============================================================================
# JOIN SIMD CONFIGURATION
# ==============================================================================

# Enable SIMD acceleration for JOIN operations (default: true)
join_simd_enabled: true

# Auto-detect CPU SIMD support (default: true)
join_simd_auto_detect: true

# ==============================================================================
# WHERE CLAUSE OPTIMIZATION CONFIGURATION
# ==============================================================================

# SIMD Configuration
# Enable SIMD acceleration for WHERE clause comparisons (default: true)
where_simd_enabled: true

# Auto-detect CPU SIMD support for WHERE clauses (default: true)
where_simd_auto_detect: true

# Bloom Filter Configuration
# Enable Bloom filter pre-filtering for multi-condition WHERE clauses (default: true)
where_bloom_enabled: true

# Minimum document count to activate Bloom filtering (default: 500)
where_bloom_min_documents: 500

# Batch/Columnar SIMD Configuration
# Enable batch/columnar SIMD processing for WHERE clauses (default: true)
where_batch_simd_enabled: true

# Minimum document count for batch SIMD processing (default: 100)
where_batch_min_size: 100

# Expression Caching Configuration
# Enable expression caching and predicate reordering (default: true)
where_expression_cache_enabled: true

# LRU cache size for compiled expressions (default: 1000)
where_expression_cache_size: 1000

# ==============================================================================
# GROUP BY PERFORMANCE OPTIMIZATION CONFIGURATION (Phases 1-3)
# ==============================================================================

# Rows below this use HashAggregate, above use Sort+GroupAggregate (default: 10000)
groupby_hash_aggregate_row_threshold: 10000

# Workers for parallel page loading during GROUP BY operations (default: max(8, numCPU))
# Minimum 8 workers, scales with CPU cores for optimal GROUP BY performance
# Set higher for GROUP BY queries on large bundles with many pages
groupby_parallel_page_workers: 8

# Enable cache warming on bundle open (default: true)
# Pre-parses segment files into cache to reduce cold-start latency
# Opt-out: set to false for memory-constrained environments
groupby_cache_warming_enabled: true

# Memory budget for cache warming in MB (default: 512)
# Limits how much memory is used for pre-warming parsed document cache
# Warming stops when this limit is reached
groupby_cache_warming_max_mb: 512

# Maximum staleness for copy-on-write snapshots in milliseconds (default: 10)
# GROUP BY queries can use cached page snapshots up to this age
# Lower values = fresher data but more lock contention
# Higher values = less contention but potentially stale reads
groupby_snapshot_staleness_ms: 10

# ==============================================================================
# BACKUP & RESTORE CONFIGURATION
# ==============================================================================

# Directory for backup files (default: "./backups")
backup_dir: "./backups"

# Compression format: "gzip", "zstd", "none" (default: "gzip")
backup_compression: "gzip"

# Include index files in backups (default: true)
backup_include_indexes: true

# ==============================================================================
# MIGRATION SYSTEM CONFIGURATION
# ==============================================================================

# Maximum commands per migration (default: 1000)
max_migration_commands: 1000

# Performance warning threshold in seconds (default: 1.0)
migration_performance_threshold: 1.0

# Maximum validation report size in bytes (default: 10485760 = 10MB)
max_validation_report_size: 10485760

# Days to retain validation reports (default: 30)
validation_report_retention_days: 30

# Enable automatic reverse command generation (default: true)
enable_auto_reverse: true

# Require explicit DOWN commands in migrations (default: false)
require_explicit_down_commands: false

# Timeout for migration operations in seconds (default: 300)
migration_timeout_seconds: 300

# ==============================================================================
# GRAPHQL CONFIGURATION
# ==============================================================================

# Enable GraphQL API (default: false)
enable_graphql: false

# GraphQL Security Configuration (Layers 1-5)
# Enable query complexity analysis - Layer 1 (default: true)
enable_complexity_limit: true

# Enable query depth limiting - Layer 2 (default: true)
enable_depth_limit: true

# Enable per-user rate limiting - Layer 3 (default: true)
enable_graphql_rate_limit: true

# Enable query execution timeout - Layer 4 (default: true)
enable_query_timeout: true

# Enable query metrics monitoring - Layer 5 (default: true)
enable_query_monitoring: true

# Rate limiting algorithm: "token-bucket" or "time-bucket" (default: "token-bucket")
graphql_rate_algorithm: "token-bucket"

# ==============================================================================
# SYNDRQL QUERY TIMEOUT CONFIGURATION
# ==============================================================================

# Default query execution timeout in seconds (default: 300)
# Applied to all regular user queries when enable_query_timeout is true
query_timeout_seconds: 300

# Admin query execution timeout in seconds (default: 600)
# Admin users get extended timeouts for complex maintenance queries
admin_query_timeout_seconds: 600

# ==============================================================================
# PER-QUERY MEMORY LIMITS (DoS Protection)
# ==============================================================================

# Maximum memory per query in MB (default: 25)
# Server-wide limit applied to all SELECT queries across all databases
# Protects against memory exhaustion attacks via sampling-based projection
# Note: JOIN operations have separate MemoryLimit in JoinRequest
query_max_memory_mb: 25

# Maximum memory per admin query in MB (default: 25)
# Same limits apply to admin users for now
admin_query_max_memory_mb: 25

# ==============================================================================
# QUERY OPTIMIZATION CONFIGURATION
# ==============================================================================

# Tier 1 Subquery Execution Settings
# Enable IN/EXISTS subquery support with configurable strategy selection
subquery_enabled: true  # Enable subquery support (default: true)

# Strategy threshold: use IN-list materialization below this row count (default: 100)
subquery_small_threshold: 100

# Strategy threshold: use HashJoin below this row count (default: 10000)
# Above this threshold, IndexedLookup is used if index available
subquery_medium_threshold: 10000

# Maximum subquery nesting depth (default: 3)
# Prevents stack overflow and ensures reasonable query complexity
subquery_max_depth: 3

# Maximum memory for IN-list materialization in MB (default: 10)
# Forces HashJoin strategy if estimated memory exceeds this limit
subquery_max_inlist_memory_mb: 10

# ==============================================================================
# STATISTICS COLLECTION & QUERY OPTIMIZATION CONFIGURATION
# ==============================================================================

# Statistics Storage Configuration
# Compression threshold in MB for statistics files (default: 1)
# Statistics larger than this will be compressed (gzip <5MB, zstd >=5MB)
stats_compression_threshold_mb: 1

# Auto-Analyze Configuration
# Automatically collect statistics when data changes significantly
# Enable automatic statistics collection (default: true)
stats_auto_analyze_enabled: true

# Minimum document changes before auto-analyze triggers (default: 1000)
stats_auto_analyze_threshold: 1000

# Percentage of bundle size that triggers auto-analyze (default: 0.10 = 10%)
# Auto-analyze triggers when: changes >= max(threshold, bundle_size * ratio)
stats_auto_analyze_ratio: 0.10

# Scheduled Analysis Configuration
# Run statistics collection during off-peak hours for large bundles
# Enable scheduled statistics collection (default: false)
stats_scheduled_analyze_enabled: false

# Time to run scheduled analysis in HH:MM format, server local time (default: "02:00")
stats_scheduled_analyze_time: "02:00"

# Minimum bundle size for scheduled analysis (default: 100000)
# Only bundles with at least this many documents are analyzed on schedule
stats_scheduled_analyze_min_docs: 100000

# ==============================================================================
# CONCURRENCY & LOCKING CONFIGURATION (HIGH-007)
# ==============================================================================

# Timeout for lock acquisition in seconds (default: 30)
# Used by document-level locks during transactions
# Increase for complex multi-statement transactions that may hold locks longer
# Decrease to fail fast on deadlocks or stuck operations
lock_timeout_seconds: 30

# Maximum number of worker pools (default: 10)
# Limits the number of named worker pools that can be created for async operations
# Increase if you need many different async operation types running concurrently
# Decrease to limit resource usage on constrained systems
max_worker_pools: 10

# Timeout for stopping worker pools in seconds (default: 30)
# When shutting down, worker pools have this much time to finish current tasks
# Increase if operations take longer to complete during shutdown
# Decrease to force faster shutdown (may interrupt operations)
worker_pool_stop_timeout_seconds: 30

# ==============================================================================
# GHOST CLEANUP (AUTOMATIC COMPACTION) CONFIGURATION
# ==============================================================================

# Enable automatic ghost record cleanup worker (default: true)
# SQL Server-style background compaction that runs periodically
ghost_cleanup_enabled: true

# Cleanup cycle interval in seconds (default: 10)
# How often the ghost cleanup worker scans for records to compact
ghost_cleanup_interval_seconds: 10

# Batch size for ghost record processing (default: 10000)
# Maximum number of records to process in a single cleanup cycle
ghost_cleanup_batch_size: 10000

# Active query pause threshold (default: 500)
# Cleanup worker pauses when this many queries are active to avoid contention
ghost_cleanup_pause_threshold: 500

# Tombstone ratio threshold for compaction (default: 0.3)
# Trigger compaction when tombstones exceed this percentage (30%)
ghost_cleanup_tombstone_ratio: 0.3

# ==============================================================================
# MVCC GC (AUTOMATIC VERSION CLEANUP) CONFIGURATION
# ==============================================================================

# Enable automatic MVCC version cleanup (default: true)
# Background worker that scans for version accumulation and triggers compaction
mvcc_gc_enabled: true

# GC cycle interval in seconds (default: 30)
# How often the MVCC GC worker scans for version accumulation
mvcc_gc_interval_seconds: 30

# Batch size for bundle processing (default: 10)
# Maximum number of bundles to process in a single GC cycle
mvcc_gc_batch_size: 10

# Active query pause threshold (default: 500)
# GC worker pauses when this many queries are active to avoid contention
mvcc_gc_pause_threshold: 500

# Max versions threshold (default: 5)
# Trigger compaction if document has more than this many versions
mvcc_gc_max_versions_threshold: 5

# Minimum version age in hours (default: 1)
# Versions must be at least this old before being considered for GC
mvcc_gc_min_version_age_hours: 1

# ==============================================================================
# BUNDLE FILE COMPACTION CONFIGURATION
# ==============================================================================
compaction:
  # Maximum number of parallel compaction workers (default: 3)
  # PostgreSQL uses autovacuum_max_workers = 3 by default
  max_workers: 3
  
  # Maximum I/O throughput in MB/s for normal compaction (default: 50)
  max_io_mbps: 50
  
  # Degraded mode I/O throughput in MB/s (default: 10)
  # Used when compaction is forced after sustained high load
  degraded_io_mbps: 10
  
  # Trigger A: Tombstone ratio threshold (default: 0.20)
  # Compact when tombstones exceed 20% of total records
  tombstone_ratio_threshold: 0.20
  
  # Trigger B: File count threshold (default: 10)
  # Compact when bundle has more than 10 files
  file_count_threshold: 10
  
  # Trigger C: Small file age threshold in hours (default: 1)
  # Merge small files (< 32MB) older than this threshold
  small_file_age_hours: 1
  
  # Trigger C: Small file size threshold in MB (default: 32)
  small_file_size_mb: 32
  
  # Trigger D: Large bundle size threshold in GB (default: 1)
  large_bundle_size_gb: 1
  
  # Trigger D: Fragmentation threshold (default: 0.30)
  # Compact large bundles when fragmentation exceeds 30%
  fragmentation_threshold: 0.30

# ==============================================================================
# VIEWS CONFIGURATION
# ==============================================================================

# Materialized View Stale Warning Threshold
# Number of hours after last refresh before showing stale data warning (default: 48)
# Set to 0 to disable stale warnings
view_stale_warning_hours: 48

# ==============================================================================
# TLS/SSL CONFIGURATION (Not yet implemented)
# ==============================================================================

# Enable TLS/SSL (default: false)
# tls_enabled: false

# Path to TLS certificate file
# tls_cert_file: ""

# Path to TLS private key file
# tls_key_file: ""

# Generate self-signed certificate if none exists (default: false)
# tls_generate_self_signed: false

# Require client certificates (default: false)
# tls_require_client_cert: false

# Path to CA file for client certificate validation
# tls_ca_file: ""

# ==============================================================================
# NOTES
# ==============================================================================
# 
# - Command-line flags take precedence over this configuration file
# - Unspecified options will use default values
# - Boolean values must be lowercase: true or false
# - Numeric values must not be quoted
# - String values can be quoted or unquoted
# - Unknown fields are silently ignored
# 
# For more information, see the SyndrDB documentation
